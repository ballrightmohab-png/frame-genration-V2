name: Build & Package LeviFrameGenSmooth .levipack

on:
  push:
    branches: [ main, master, "jules-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc g++ zip

      - name: Configure CMake
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build Mod & levipack Package
        run: |
          cd build
          make -j$(nproc) levipack levi_mod_runner mod_tests

      - name: Run Mod Test Suite
        run: |
          cd build
          ./mod_tests

      - name: Upload .levipack Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviFrameGenSmooth-ModPack
          path: build/LeviFrameGenSmooth.levipack
